# Render blueprint for the PRAGUKTI backend (FastAPI + ML engines).
#
# The backend is not deployable on Vercel: its dependency tree is roughly 540 MB
# installed (xgboost, shap -> llvmlite/numba, scipy, pandas, scikit-learn, pyproj)
# against a 250 MB serverless limit, and it writes to disk -- the SQLite analyses
# store, uploaded documents, and the GIS boundary and assessment stores -- which a
# read-only serverless filesystem cannot support. Render runs it as a real container.

services:
  - type: web
    name: pragukti-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Bearer token registry as inline JSON. Generate with:
      #   cd backend && python scripts/generate_api_tokens.py
      # Set it in the Render dashboard; it must never be committed.
      - key: GIS_API_TOKENS
        sync: false
      # Comma-separated browser origins allowed by CORS. Set this to the Vercel
      # production URL once the frontend is deployed.
      - key: CORS_ORIGINS
        sync: false
